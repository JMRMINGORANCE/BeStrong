version: 2
updates:
  # Librerías y plugins de Gradle (gradle/libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Los saltos de versión mayor (AGP 9, Spotless 8…) se hacen a mano: suelen requerir cambios de código
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      testing:
        patterns: ["org.robolectric*", "io.github.takahirom.roborazzi*", "junit*"]
  # Acciones de GitHub de los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
