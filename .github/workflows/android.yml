name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de core
        run: ./gradlew :core:test

      - name: Compilar móvil y reloj
        run: ./gradlew --continue :mobile:assembleDebug :wear:assembleDebug

      - name: Tests de interfaz y capturas (Robolectric + Roborazzi)
        run: ./gradlew :mobile:testDebugUnitTest -Proborazzi.test.record=true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            mobile/build/outputs/roborazzi/
            mobile/build/reports/tests/
          retention-days: 14

      - name: Publicar capturas en la rama "capturas"
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -d mobile/build/outputs/roborazzi ] && [ -n "$(ls -A mobile/build/outputs/roborazzi)" ]; then
            cd mobile/build/outputs/roborazzi
            git init -q -b capturas
            git add -A
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" capturas
          fi

      - name: Lint
        run: ./gradlew --continue :mobile:lintDebug :wear:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 14
