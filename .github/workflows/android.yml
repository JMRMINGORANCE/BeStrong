name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Estilo de código (ktlint)
        run: ./gradlew spotlessCheck

      - name: Análisis estático (detekt)
        # CLI independiente de Gradle (sin conflictos con la versión de Kotlin). Los avisos
        # existentes están en config/detekt/baseline.xml: solo fallan los problemas nuevos.
        run: |
          curl -sSL -o detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          inputs=$(ls -d core/src/main data/src/main shared/src/main feature/*/src/main mobile/src/main wear/src/main designsystem/src/main | paste -sd, -)
          java -jar detekt.jar --input "$inputs" \
            --config config/detekt/detekt.yml --build-upon-default-config --baseline config/detekt/baseline.xml

      - name: Tests de core
        run: ./gradlew :core:test

      - name: Compilar móvil y reloj
        id: compile
        # Los errores de compilación y de recursos se publican también como anotaciones (visibles al momento)
        run: |
          set -o pipefail
          ./gradlew --continue :mobile:assembleDebug :wear:assembleDebug :watchface:assembleDebug 2>&1 | tee build-debug.log || {
            grep -E "^e: |AAPT: error|error: " build-debug.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Tests de interfaz y capturas (Robolectric + Roborazzi)
        timeout-minutes: 20
        run: ./gradlew --continue :mobile:testDebugUnitTest :wear:testDebugUnitTest -Proborazzi.test.record=true

      - name: Comparar capturas con las de referencia
        # Referencia = últimas capturas publicadas en la rama «capturas». Informa de los cambios
        # (con imagen de diferencias) en el resumen; no falla, porque los cambios pueden ser buscados.
        if: always()
        run: |
          cp wear/build/outputs/roborazzi/*.png mobile/build/outputs/roborazzi/ 2>/dev/null || true
          git fetch -q --depth=1 origin capturas:refs/remotes/origin/capturas 2>/dev/null || { echo "Sin referencia"; exit 0; }
          mkdir -p ref mobile/build/outputs/roborazzi/diff
          git archive origin/capturas | tar -x -C ref
          {
            echo "### Capturas frente a la referencia"
            echo "| Captura | Píxeles distintos |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          changed=0
          for new in mobile/build/outputs/roborazzi/*.png; do
            name=$(basename "$new")
            if [ ! -f "ref/$name" ]; then echo "| $name | nueva |" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            px=$(compare -metric AE -fuzz 2% "ref/$name" "$new" "mobile/build/outputs/roborazzi/diff/$name" 2>&1 >/dev/null || true)
            px=${px%% *}
            if [ "${px:-0}" != "0" ]; then echo "| $name | $px |" >> "$GITHUB_STEP_SUMMARY"; changed=$((changed+1)); else rm -f "mobile/build/outputs/roborazzi/diff/$name"; fi
          done
          echo "Capturas con cambios: $changed" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            mobile/build/outputs/roborazzi/
            mobile/build/reports/tests/
            wear/build/outputs/roborazzi/
          retention-days: 14

      - name: Publicar capturas en la rama "capturas"
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p mobile/build/outputs/roborazzi/test-results
          cp mobile/build/test-results/testDebugUnitTest/*.xml mobile/build/outputs/roborazzi/test-results/ 2>/dev/null || true
          cp wear/build/test-results/testDebugUnitTest/*.xml mobile/build/outputs/roborazzi/test-results/ 2>/dev/null || true
          cp wear/build/outputs/roborazzi/*.png mobile/build/outputs/roborazzi/ 2>/dev/null || true
          # Esquema de Room exportado (hay que versionarlo para probar futuras migraciones)
          cp -r data/schemas mobile/build/outputs/roborazzi/schemas 2>/dev/null || true
          if [ -n "$(ls -A mobile/build/outputs/roborazzi)" ]; then
            cd mobile/build/outputs/roborazzi
            git init -q -b capturas
            git add -A
            if git diff --cached --quiet; then echo "Sin capturas"; exit 0; fi
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" capturas
          fi

      - name: Compilar release (R8)
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: ./gradlew --continue :mobile:assembleRelease :wear:assembleRelease :watchface:assembleRelease

      - name: Tamaño de los APK
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: |
          {
            echo "### Tamaño de los APK"
            echo "| APK | Tamaño |"
            echo "|---|---|"
            for f in mobile/build/outputs/apk/*/*.apk wear/build/outputs/apk/*/*.apk watchface/build/outputs/apk/*/*.apk; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        if: (success() || failure()) && steps.compile.outcome == 'success'
        run: |
          ./gradlew --continue :mobile:lintDebug :wear:lintDebug || {
            # Todos los errores en el registro (Gradle solo muestra el primero)
            grep -h -A4 "Error:" */build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Cada versión de main se sube sola a Google Play (prueba cerrada del móvil y del reloj). Mira PLAY_STORE.md.
  # Sin la clave de subida (KEYSTORE_*) o sin la cuenta de servicio (PLAY_SERVICE_ACCOUNT_JSON) el trabajo se salta.
  play:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Comprobar secretos
        id: secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Faltan los secretos KEYSTORE_* o PLAY_SERVICE_ACCOUNT_JSON: no se sube a Google Play (mira PLAY_STORE.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.ok == 'true'

      - name: Preparar clave de subida
        if: steps.secrets.outputs.ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Compilar los .aab (móvil y reloj)
        if: steps.secrets.outputs.ok == 'true'
        run: ./gradlew :mobile:bundleRelease :wear:bundleRelease

      - name: Subir a Google Play
        if: steps.secrets.outputs.ok == 'true'
        env:
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_WEAR_TRACK: ${{ vars.PLAY_WEAR_TRACK }}
        run: |
          export BESTRONG_VERSION="$(grep -m1 'versionName = "' mobile/build.gradle.kts | cut -d'"' -f2).${GITHUB_RUN_NUMBER}"
          pip install -q google-auth requests
          python3 .github/scripts/play_upload.py mobile/build/outputs/bundle/release/mobile-release.aab wear/build/outputs/bundle/release/wear-release.aab

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: aab-play
          path: |
            mobile/build/outputs/bundle/release/*.aab
            wear/build/outputs/bundle/release/*.aab
          retention-days: 14
