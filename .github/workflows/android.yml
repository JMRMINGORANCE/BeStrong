name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de core
        run: ./gradlew :core:test

      - name: Compilar móvil y reloj
        run: ./gradlew --continue :mobile:assembleDebug :wear:assembleDebug

      - name: Lint
        run: ./gradlew --continue :mobile:lintDebug :wear:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          retention-days: 14
