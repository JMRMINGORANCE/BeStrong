name: Baseline Profile

# Genera el Baseline Profile del móvil en un emulador y lo publica en la rama "baseline-profile".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Generar perfil
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :mobile:generateReleaseBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20 \
            --stacktrace 2>&1 | tee bp.log

      - name: Prueba de humo de la build minificada (R8)
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.class=com.bestrong.baselineprofile.ReleaseSmokeTest \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE \
            2>&1 | tee smoke.log

      - name: Medir arranque (Macrobenchmark)
        id: startup
        continue-on-error: true
        run: |
          set -o pipefail
          git fetch -q origin baseline-profile && git show origin/baseline-profile:startup.json > /tmp/previous-startup.json 2>/dev/null || true
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.class=com.bestrong.baselineprofile.StartupBenchmark \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE \
            2>&1 | tee startup.log
          mkdir -p /tmp/bp
          python3 tools/startup_check.py /tmp/previous-startup.json | tee -a startup.log

      - name: Publicar resultado en la rama baseline-profile
        if: always()
        run: |
          mkdir -p /tmp/bp
          tail -n 400 bp.log > /tmp/bp/log.txt || true
          tail -n 300 smoke.log > /tmp/bp/smoke-log.txt || true
          tail -n 120 startup.log > /tmp/bp/startup-log.txt || true
          echo "${{ steps.startup.outcome }}" > /tmp/bp/startup-outcome.txt
          [ -f /tmp/bp/startup.json ] || cp /tmp/previous-startup.json /tmp/bp/startup.json 2>/dev/null || true
          echo "${{ steps.smoke.outcome }}" > /tmp/bp/smoke-outcome.txt
          # Errores de la app en el emulador (crashes por R8, etc.)
          find baselineprofile/build mobile/build -name 'logcat*.txt' -path '*managedDevice*' 2>/dev/null | while read f; do
            grep -n -A40 "FATAL EXCEPTION\|AndroidRuntime" "$f" | head -200 >> /tmp/bp/crashes.txt || true
          done
          grep -h "No apareció\|no apareció\|paquete=" smoke.log >> /tmp/bp/smoke-screen.txt 2>/dev/null || true
          find baselineprofile/build -name '*.xml' -path '*test-results*' -exec cp {} /tmp/bp/ \; 2>/dev/null || true
          find mobile/src -path '*generated/baselineProfiles*' -name '*.txt' -exec cp {} /tmp/bp/ \; || true
          find baselineprofile/build -name '*.txt' -path '*managed_device*' -exec cp {} /tmp/bp/ \; 2>/dev/null || true
          echo "${{ steps.generate.outcome }}" > /tmp/bp/outcome.txt
          cd /tmp/bp
          git init -q -b baseline-profile
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Baseline profile de ${GITHUB_SHA::7} (${{ steps.generate.outcome }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" baseline-profile

      - name: Fallar si no se generó
        if: steps.generate.outcome != 'success' || steps.smoke.outcome != 'success' || steps.startup.outcome != 'success'
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-profile
          path: |
            mobile/src/**/generated/baselineProfiles/
            baselineprofile/build/outputs/
          retention-days: 14
